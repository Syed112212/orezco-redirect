<style>
:root{--verde:#2bee4b;--musgo:#93b799;--eco:#c4e4c9;--prensa:#121613;--gris:#516254;--hueso:#fafffa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;

  text-decoration:none;padding:11px 19px;border-radius:5px;font-weight:600;font-size:14px;
  box-shadow:0 2px 0 var(--musgo)}
a:active{box-shadow:0 1px 0 var(--musgo);transform:translateY(1px)}
a:focus-visible{outline:2px solid var(--prensa);outline-offset:3px}
