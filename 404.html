<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="canonical" href="https://contaes.com/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://contaes.com/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f5f4;color:#000;
       font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       text-align:center;padding:24px}
  h1{font-size:clamp(26px,5vw,38px);font-weight:600;letter-spacing:-.03em;margin:0 0 12px}
  p{margin:0 0 22px;color:#615d59}

<script>

</script>
</head>

  <main>
    <h1>Orezco ahora es Contaes</h1>
    <p>Te estamos llevando a la dirección nueva.</p>
