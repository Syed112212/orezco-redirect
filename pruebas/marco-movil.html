<!doctype html><meta charset="utf-8">
<script>
/* Chrome headless en Windows no rinde por debajo de ~500px de ancho: una
   captura pedida a 390px es un recorte de un render de 500 y aparenta
   desbordes que no existen. Por eso el móvil se mira en un iframe del
   ancho exacto. */
window.__enLocal = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) >= 0;
window.__avisaFuera = function () {
  document.addEventListener('DOMContentLoaded', function () {
    document.body.setAttribute('style', 'font:15px/1.6 system-ui;padding:40px;max-width:32em;background:#f6f6f8;color:#1f1f1f');
    document.body.innerHTML =
      '<h1 style="font-size:20px;margin:0 0 12px">Página de pruebas</h1>' +
      '<p style="margin:0 0 12px">Solo funciona sirviendo el proyecto en local.</p>' +
      '<p style="margin:0"><a href="/" style="color:#1f1f1f">Ir al CRM</a></p>';
  });
};
if (!window.__enLocal) window.__avisaFuera();
</script>
<title>marco móvil</title>
<style>
  body{margin:0;background:#555;display:flex;gap:20px;padding:20px;font:12px system-ui;color:#fff}
  figure{margin:0}
  figcaption{margin-bottom:6px}
  iframe{border:0;background:#fff;display:block}
</style>
<figure><figcaption>390 × 780 — panel</figcaption>
  <iframe src="/#panel" width="390" height="780"></iframe></figure>
<figure><figcaption>390 × 780 — clientes</figcaption>
  <iframe src="/#clientes" width="390" height="780"></iframe></figure>
<figure><figcaption>320 × 780 — el más estrecho</figcaption>
  <iframe src="/#paises" width="320" height="780"></iframe></figure>
