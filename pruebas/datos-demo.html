   local no deben ejecutarse nunca: alguien que llegara por un enlace
   perderia sus datos sin tocar nada. */
(function () {
  var h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return;

    '<body style="font:15px system-ui;padding:40px;max-width:32em">' +
    '<h1 style="font-size:20px">Pagina de pruebas</h1>' +
    '<p>Solo funciona sirviendo el proyecto en local. Escribe en el almacen ' +
    'del navegador, asi que aqui se queda parada a proposito.</p>' +
    '<p><a href="/">Ir al CRM</a></p></body>';
  throw new Error('pagina de pruebas fuera de local');
})();
</script>
